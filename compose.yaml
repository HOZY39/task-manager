version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tm-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskmanagerdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./tm-backend
      dockerfile: Dockerfile
    container_name: tm-backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmanagerdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password

  frontend:
    build:
      context: ./tm-front
      dockerfile: Dockerfile
    container_name: tm-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
