<body>
<nav class="navbar">
  <div class="logo" routerLink="/">Task Manager</div>
  <div class="nav-links">
    <span *ngIf="isLoggedIn()">Welcome, {{ username }}!</span>
    <a routerLink="/login" *ngIf="!isLoggedIn()">Login</a>
    <a routerLink="/register" *ngIf="!isLoggedIn()">Register</a>
    <button routerLink="/addquestion" *ngIf="isLoggedIn()" class="addquestion-btn">Add question</button>
    <button (click)="logout()" *ngIf="isLoggedIn()" class="logout-btn">Logout</button>
  </div>
</nav>

<div class="content">
  <router-outlet></router-outlet>
</div>

<div class="footer">
  <p>&copy; 2025 Task Manager</p>
</div>

<link rel="stylesheet" href="styles.css">
</body>
