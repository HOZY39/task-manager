<div class="home-container">
    <input 
      type="text" 
      [(ngModel)]="searchQuery" 
      placeholder="Task..." 
      class="search-input"
    />
    <button (click)="searchTask()" class="search-btn">Search</button>
  
    <div class="subjects-grid" *ngIf="showSubjects">
      <div 
        *ngFor="let subject of subjects" 
        class="subject-tile" 
        (click)="goToTopics(subject.name)"
      >
        {{ subject.name }}
      </div>
    </div>

    <div *ngIf="!showSubjects">
        <button (click)="backToSubjects()" >Back</button>
        <div class="subjects-grid">
            <a 
              *ngFor="let section of sections" 
              [routerLink]="['/tasks', section.name]"
              class="subject-tile"
            >
              {{ section.name }}
            </a>
          </div>
    </div>


  </div>
